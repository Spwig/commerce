<div class="em-block em-block-image" style="text-align:{{ align|default:'center' }};">
  {% if src %}
    <img src="{{ src }}" alt="{{ alt }}" class="em-image" style="{% if width %}width:{{ width }};{% endif %}">
  {% else %}
    <div class="em-image-placeholder"><i class="fas fa-image"></i></div>
  {% endif %}
</div>
