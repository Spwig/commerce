<div class="em-block em-block-voucher">
  {% if heading %}<div class="em-voucher-heading">{{ heading }}</div>{% endif %}
  <div class="em-voucher-code">{{ code }}</div>
  {% if description %}<div class="em-voucher-desc">{{ description }}</div>{% endif %}
  {% if button_url %}<a class="em-btn" href="{{ button_url }}">{{ button_text|default:'Shop now' }}</a>{% endif %}
</div>
