# Pre-commit hook config. Contributors run `pre-commit install` once and every
# subsequent `git commit` runs the same lint checks the CI enforces.
#
# Mirror of .github/workflows/lint.yml. When you bump a tool version there,
# bump the matching rev here too.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      # The mirrors-prettier repo is archived and has no tags past v3.1.0,
      # so prettier runs as a local hook against the repo's own installed
      # version — the exact binary `npm run format:check` uses in CI.
      - id: prettier
        name: prettier
        entry: npx prettier --write --ignore-unknown
        language: system
        files: \.(js|jsx|ts|tsx|json|css|scss)$
      - id: eslint
        name: eslint
        entry: npx eslint
        language: system
        files: \.(js|jsx|ts|tsx)$
        exclude: |
          (?x)^(
            node_modules/|
            staticfiles/|
            .*/vendor/|
            .*/ckeditor5/|
            .*\.min\.js|
            pos_app/dist/|
            pos_app/frontend/node_modules/|
            pos_app/frontend_build/|
            .*/migrations/
          )

      - id: check-public-docs
        name: check-public-docs (CLAUDE.md ships publicly)
        entry: python scripts/check_public_docs.py
        language: system
        pass_filenames: false
        files: ^CLAUDE\.md$

      # New staff-facing admin views must gate on a capability, not just
      # @staff_member_required. Baseline-ratcheted: only NEW gaps fail.
      - id: permission-coverage
        name: permission-coverage (staff views must gate on a capability)
        entry: python3 scripts/permission_coverage.py
        language: system
        pass_filenames: false
        always_run: true

      # Django {# #} comments are single-line only; a multi-line one renders
      # literally on the page. Catch it before it reaches a merchant.
      - id: check-template-comments
        name: check-template-comments (no multi-line {# #})
        entry: python3 scripts/check_template_comments.py
        language: system
        files: \.html$
        exclude: |
          (?x)^(
            node_modules/|
            staticfiles/|
            components_data/
          )
