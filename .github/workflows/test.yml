name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Collapse duplicate runs for the same PR/ref (Gitea can emit opened +
# synchronize back-to-back for API-created PRs): the newer run cancels
# the older one instead of both burning a runner slot.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    # Job-level env — inherited by every step unless overridden.
    # DB_HOST/REDIS_HOST default to 'localhost' (GitHub Actions runner
    # publishes service ports on the host). The first step below flips
    # them to service names for Gitea Actions (act), which networks
    # service containers by DNS alias instead of host port forwarding.
    env:
      DJANGO_SETTINGS_MODULE: core.settings
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: spwig_test
      DB_USER: spwig
      DB_PASSWORD: spwig
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      # Django reads SPWIG_SECRET_KEY (then DJANGO_SECRET_KEY); a bare
      # SECRET_KEY env is ignored, so it must carry this name or settings
      # silently fall back to the insecure default. The "test-secret"
      # substring makes tests/config/test_security_settings.py skip in CI.
      SPWIG_SECRET_KEY: ci-test-secret-key-not-for-production
      # Test-only Fernet key. Email / SMS provider credential fields
      # get symmetrically encrypted at rest — no default in settings
      # means every send-service test fails at credential-write.
      # Rotate freely; not tied to any real data.
      EMAIL_ENCRYPTION_KEY: "wFUuMXZIwn5s2SAAi1hd4b9Jl0cAzyHl8Z7_fNZKeHk="
      SPWIG_TELEMETRY: "0"

    services:
      postgres:
        # pgvector/pgvector image = postgres 16 + pgvector extension
        # pre-installed. core/models.py uses pgvector.django.VectorField
        # for semantic-search embeddings, so migrations `CREATE EXTENSION
        # vector` on first apply. The plain postgres:16 image doesn't
        # have the .so, and migrations fail before any test runs.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: spwig
          POSTGRES_PASSWORD: spwig
          POSTGRES_DB: spwig_test
          # Data dir a level below the tmpfs mount so initdb gets a clean,
          # correctly-owned 0700 dir (tmpfs root is 1777 and initdb refuses it).
          PGDATA: /var/lib/postgresql/data/pgdata
        # Host port published so the service is reachable at localhost:5432 on
        # GitHub-hosted runners (the job runs on the VM, not in a container).
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql/data:rw,size=2g
          --health-cmd "pg_isready -U spwig"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        # Host port published so the service is reachable at localhost:6379 on
        # GitHub-hosted runners (the job runs on the VM, not in a container).
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Configure env for Gitea Actions (act)
        # act sets env.ACT=true when it invokes the runner container.
        # GitHub Actions does not — so this step is a no-op there.
        # - DB_HOST/REDIS_HOST: act networks services by DNS alias, not
        #   host-port publishing like GitHub Actions runner-native jobs
        # - SPWIG_IS_HQ=true: shop-dev's tree still contains the HQ apps
        #   (developer_portal, license_checkout, marketplace_checkout).
        #   Enable them in INSTALLED_APPS so tests that depend on them
        #   can find their models. Commerce doesn't have these files
        #   (blocklisted from sync + purged from history), so this env
        #   flag would break commerce — kept Gitea-only.
        if: env.ACT == 'true'
        run: |
          echo "DB_HOST=postgres" >> $GITHUB_ENV
          echo "REDIS_HOST=redis" >> $GITHUB_ENV
          echo "SPWIG_IS_HQ=true" >> $GITHUB_ENV

      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests (scoped on PRs, full audited suite on dev/main)
        # PRs run only the changed app's tests + a smoke baseline
        # (scripts/select_test_paths.py) to keep per-PR CI fast. The FULL audited
        # ~4,400-test suite still runs on every dev/main push as the cross-app
        # net — and on PRs whose blast radius is wide (core/config/deps) or whose
        # diff can't be scoped. Money-handling code can't land untested: a
        # changed money app runs its own tests per-PR, and everything runs on dev
        # before release. See docs/.claude_code/plans/test-suite-drift-recovery.md
        # (Phases 1 + 4 + 5) for the audited scope in run_full below.
        run: |
          run_full() {
            pytest -n auto tests/community_edition/ tests/integration/test_sandbox.py -v
            pytest -n auto --create-db -v \
              tests/unit/ tests/integration/ tests/contract/ tests/catalog/ \
              tests/invariants/ tests/tier2/ \
              tests/rbac/ tests/integrity/ accounts/tests/ admin_api/tests/ \
              catalog/tests/ design/tests/ email_system/tests/ loyalty/tests/ \
              migration/tests/ orders/tests/ referrals/tests/ search/tests/ \
              shipping/tests/ social_sharing/tests/ subscriptions/tests/ \
              cart/ core/ page_builder/ payment_providers/ pos_api/ pos_app/ \
              vouchers/ wallet/
          }
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            run_full
            exit $?
          fi
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}" || true
          TARGETS=$(python scripts/select_test_paths.py "origin/${{ github.base_ref }}" || true)
          if [ -z "$TARGETS" ]; then
            echo "Wide blast radius or undetermined diff — running the full suite."
            run_full
          else
            echo "Scoped PR test targets: $TARGETS"
            pytest -n auto --create-db -v $TARGETS
          fi

  # Oracle-parity (Tier-3, NO browser): proves the ORM and HTTP footprint
  # backends agree over real HTTP — the shared-contract seam the standalone
  # spwig-e2e cert suite depends on. It uses live_server (a real socket) but NO
  # Playwright, so it runs reliably on the self-hosted Gitea/act runner and
  # GATES EVERY PR. Split out of the browser job precisely so a flaky browser
  # install can never take the contract check down with it.
  oracle-parity:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: core.settings
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: spwig_test
      DB_USER: spwig
      DB_PASSWORD: spwig
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      SPWIG_SECRET_KEY: ci-test-secret-key-not-for-production
      EMAIL_ENCRYPTION_KEY: "wFUuMXZIwn5s2SAAi1hd4b9Jl0cAzyHl8Z7_fNZKeHk="
      SPWIG_TELEMETRY: "0"
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: spwig
          POSTGRES_PASSWORD: spwig
          POSTGRES_DB: spwig_test
          PGDATA: /var/lib/postgresql/data/pgdata
        # Host port published so the service is reachable at localhost:5432 on
        # GitHub-hosted runners (the job runs on the VM, not in a container).
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql/data:rw,size=2g
          --health-cmd "pg_isready -U spwig"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        # Host port published so the service is reachable at localhost:6379 on
        # GitHub-hosted runners (the job runs on the VM, not in a container).
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Configure env for Gitea Actions (act)
        if: env.ACT == 'true'
        run: |
          echo "DB_HOST=postgres" >> $GITHUB_ENV
          echo "REDIS_HOST=redis" >> $GITHUB_ENV
          echo "SPWIG_IS_HQ=true" >> $GITHUB_ENV
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run oracle-parity (no browser)
        run: pytest tests/e2e/test_oracle_parity.py -m e2e --create-db -v

  # Golden BROWSER flows (Tier 3, Playwright). The authoritative run of these is
  # the nightly cron on the cert host (spwige2e.spwig.com), where Playwright +
  # the app are installed and they pass green against a real deployment — that's
  # the industry-standard "E2E against staging" tier. This CI job is a best-effort
  # convenience copy: it does NOT run on PRs and NEVER blocks the pipeline
  # (continue-on-error), because `playwright install --with-deps` is unreliable on
  # the self-hosted act runner. TODO: register the cert host as a Gitea runner and
  # run this against it on merge-to-dev for real merge-time browser gating.
  e2e-golden:
    if: github.event_name != 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: core.settings
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: spwig_test
      DB_USER: spwig
      DB_PASSWORD: spwig
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      SPWIG_SECRET_KEY: ci-test-secret-key-not-for-production
      EMAIL_ENCRYPTION_KEY: "wFUuMXZIwn5s2SAAi1hd4b9Jl0cAzyHl8Z7_fNZKeHk="
      SPWIG_TELEMETRY: "0"
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: spwig
          POSTGRES_PASSWORD: spwig
          POSTGRES_DB: spwig_test
          PGDATA: /var/lib/postgresql/data/pgdata
        # Host port published so the service is reachable at localhost:5432 on
        # GitHub-hosted runners (the job runs on the VM, not in a container).
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql/data:rw,size=2g
          --health-cmd "pg_isready -U spwig"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        # Host port published so the service is reachable at localhost:6379 on
        # GitHub-hosted runners (the job runs on the VM, not in a container).
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Configure env for Gitea Actions (act)
        if: env.ACT == 'true'
        run: |
          echo "DB_HOST=postgres" >> $GITHUB_ENV
          echo "REDIS_HOST=redis" >> $GITHUB_ENV
          echo "SPWIG_IS_HQ=true" >> $GITHUB_ENV
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Install Playwright browsers
        run: playwright install --with-deps chromium
      - name: Run golden browser flows
        run: pytest tests/e2e/test_golden_flows.py -m e2e --create-db -v

  # The committed api-schema.yml IS the published contract: the SDK
  # generator bakes it into typed clients. It once drifted 168 paths behind
  # the code because nothing regenerated it — the published SDK carried types
  # for deleted endpoints and missed ~170 real ones. This job fails the build
  # the moment code and contract disagree.
  #
  # Deliberately NOT --fail-on-warn: spectacular emits ~1119 pre-existing
  # warnings, and that cleanup is its own project. This is a drift gate only.
