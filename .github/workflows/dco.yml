name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Collapse duplicate runs for the same PR/ref (Gitea can emit opened +
# synchronize back-to-back for API-created PRs): the newer run cancels
# the older one instead of both burning a runner slot.
concurrency:
  group: dco-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Partial clone: DCO only reads commit messages in base..head,
          # never file blobs. Full history stays reachable, but the 2.2 GB
          # of historical blobs — which intermittently fail checkout with
          # 'fatal: protocol error: bad pack header' — is never fetched.
          fetch-depth: 0
          filter: blob:none

      - name: Verify Signed-off-by on every commit in the PR
        run: |
          echo "Checking commits ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          missing=0
          # --no-merges: platform-generated merge commits (e.g. Gitea's
          # "Update branch" button) carry no sign-off and never can; DCO
          # certifies authored changes, so merges are conventionally exempt.
          for sha in $(git log --no-merges --format=%H ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}); do
            if ! git log -1 --format=%B "$sha" | grep -qE "^Signed-off-by: .+ <.+@.+>"; then
              echo "::error::Commit $sha is missing Signed-off-by. Run: git commit --amend --signoff"
              missing=$((missing+1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo ""
            echo "See CONTRIBUTING.md § Developer Certificate of Origin for details."
            exit 1
          fi
          echo "All commits carry a Signed-off-by line ✓"
