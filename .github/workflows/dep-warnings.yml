name: Dep Warnings (inventory)

# Capture-only deprecation-warning inventory for the dep-watcher.
#
# The normal `test.yml` suite runs with `-p no:warnings` (pytest.ini), which
# discards EVERY warning — including RemovedInDjangoXXWarning, the signal that a
# forced upgrade is coming. This workflow re-runs the same audited suite in
# INVENTORY mode: it drops `-p no:warnings` via an `-o addopts=...` override
# (you cannot re-enable a `no:`-disabled plugin, only override the whole option
# and leave that plugin out), sets the deprecation families to `default::` so
# they RECORD but do NOT fail, loads the warn_collector plugin, and uploads the
# per-worker `warns_*.jsonl` as an artifact for the refinery classifier
# (service/dep_warnings.py) to diff against internal_tools/deps/warn_baseline.jsonl.
#
# Nothing halts here — this is discovery, not a gate. The gate (`error::`) and
# the burn-down of first-party sites come later, per
# refinery docs/.claude_code/plans/dep-deprecation-capture.md.
#
# Gated to dep/* PRs (where a bump might introduce new deprecations) and manual
# dispatch, so it never runs on ordinary feature PRs.

on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: dep-warnings-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-latest
    # Only run for dep-bump PRs (head ref dep/*) or an explicit manual dispatch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.head_ref, 'dep/')

    # Same job-level env as test.yml's test job. DB_HOST/REDIS_HOST default to
    # localhost (GitHub Actions publishes service ports on the host); the first
    # step flips them to DNS aliases under Gitea Actions (act).
    env:
      DJANGO_SETTINGS_MODULE: core.settings
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: spwig_test
      DB_USER: spwig
      DB_PASSWORD: spwig
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      # Django reads SPWIG_SECRET_KEY (see .github/workflows/test.yml); a bare
      # SECRET_KEY env is ignored and settings fall back to the insecure default.
      SPWIG_SECRET_KEY: ci-test-secret-key-not-for-production
      EMAIL_ENCRYPTION_KEY: "wFUuMXZIwn5s2SAAi1hd4b9Jl0cAzyHl8Z7_fNZKeHk="
      SPWIG_TELEMETRY: "0"
      # Give the inventory run its own test database so it never collides with a
      # concurrent test.yml run (conftest._test_db_suffix appends this).
      SPWIG_TEST_DB_SUFFIX: _dep_inv
      # warn_collector writes warns_<worker>.jsonl here (default cwd anyway).
      WARN_COLLECTOR_DIR: ${{ github.workspace }}

    services:
      postgres:
        # postgres 16 + pgvector (see test.yml for why the plain image fails).
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: spwig
          POSTGRES_PASSWORD: spwig
          POSTGRES_DB: spwig_test
          PGDATA: /var/lib/postgresql/data/pgdata
        options: >-
          --tmpfs /var/lib/postgresql/data:rw,size=2g
          --health-cmd "pg_isready -U spwig"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Configure env for Gitea Actions (act)
        # Mirrors test.yml: act networks services by DNS alias and needs the HQ
        # apps enabled. No-op on GitHub Actions.
        if: env.ACT == 'true'
        run: |
          echo "DB_HOST=postgres" >> $GITHUB_ENV
          echo "REDIS_HOST=redis" >> $GITHUB_ENV
          echo "SPWIG_IS_HQ=true" >> $GITHUB_ENV

      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # The collector lives at tests/plugins/warn_collector.py (a TRACKED path):
      # internal_tools/ is gitignored (dev-only), so the plugin was moved here so
      # a fresh Gitea checkout contains it and `-p warn_collector` can load it.
      # It matches none of pytest's python_files patterns, so a normal run never
      # collects it. See refinery docs/.claude_code/plans/dep-deprecation-capture.md.
      - name: Run suite in INVENTORY mode (record warnings, nothing fails)
        # Key flags:
        #   -o addopts=...   override pytest.ini's addopts to DROP `-p no:warnings`
        #                    (re-adding the addopts we still want). This is the
        #                    only way to defeat a `no:`-disabled plugin from CLI.
        #   -p warn_collector  load the JSONL recorder (dir on PYTHONPATH below).
        #   -W default::X      record-once-per-location, do NOT fail (inventory).
        #                      DeprecationWarning also covers RemovedInDjangoXX
        #                      (subclass); Pending + Future need their own lines.
        #   --create-db        build a fresh DB (no reuse of a stale one).
        #   -n auto            xdist workers -> per-worker warns_<worker>.jsonl.
        # Same audited path list as test.yml's run_full. Never fails the build.
        env:
          PYTHONPATH: ${{ github.workspace }}/tests/plugins
        run: |
          pytest \
            -o "addopts=--strict-markers --reuse-db -m 'not e2e' --tb=short" \
            -p warn_collector \
            -W default::DeprecationWarning \
            -W default::PendingDeprecationWarning \
            -W default::FutureWarning \
            --create-db -n auto -q \
            tests/unit/ tests/integration/ tests/contract/ tests/catalog/ \
            tests/rbac/ tests/integrity/ accounts/tests/ admin_api/tests/ \
            catalog/tests/ design/tests/ email_system/tests/ loyalty/tests/ \
            migration/tests/ orders/tests/ referrals/tests/ search/tests/ \
            shipping/tests/ social_sharing/tests/ subscriptions/tests/ \
            cart/ core/ page_builder/ payment_providers/ pos_api/ pos_app/ \
            vouchers/ wallet/ || true

      - name: Upload warning inventory
        # upload-artifact@v4 isn't supported on Gitea Actions (GHES-like) — it
        # fails with GHESNotSupportedError and reds the whole job. The inventory
        # itself is captured in the run log; the artifact is only for GitHub
        # retention, so skip the upload on the self-hosted act runner.
        if: ${{ always() && env.ACT != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: dep-warnings-jsonl
          path: warns_*.jsonl
          if-no-files-found: warn
